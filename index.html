<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="icon" href="assets/img/moon.png" type="image/png">

    <script src="assets/js/app.js" defer></script>
    <title>Moon Clicker 2</title>
</head>
<body>
    <h1 id="display" class="headerstyle">0 Moons</h1>
    <img id="clickerimg" src="assets/img/moon.png" alt="Click it!" class="imgstyle" draggable="false">

    <div class="backgroundforupgrades">

        <button id="upgradeclicks" class="upgradeclicks">
            <h1 id="tucb" class="titleupgrade">Upgrade Clicks - 10 Moons</h1>
            <img src="assets/img/moon.png" alt="Upgrade Clicks" class="upgradeimg1">
        </button>

        <button id="upgradeclicks2" class="upgradeclicks2">
            <h1 id="tucb2" class="titleupgrade2">Upgrade Moons Per Sec - 10 Moons</h1>
            <img src="assets/img/cog.png" alt="Upgrade Moons Per Sec" class="upgradeimg2">
        </button>
    </div>

    <button id="savebutton" class="savebuttonstyle">Save</button>
    <button id="wipebutton" class="wipebuttonstyle">Wipe Data</button>
    
    <p class="note" id="note">Your Game Has Been Saved!</p>
    <img src="assets/img/cog.png" alt="Settings" class="cog" id="cog">

    <div id="settingsdiv" class="settingsdiv">

    </div>

    <audio id="moonclick" src="assets/sounds/recordclicksound.wav"></audio>
    <audio id="buy" src="assets/sounds/click-345983.mp3"></audio>
    <audio id="error" src="assets/sounds/error-010-206498.mp3"></audio>
    
</body>
</html>
